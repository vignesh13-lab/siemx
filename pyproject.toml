[project]
name = "siemx"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = ["anthropic"]   # add chromadb later for RAG retrieval

[project.optional-dependencies]
dev = ["pytest>=8"]
rag = ["chromadb>=1.0"]   # optional: vector search (siemx docs embed)

[project.scripts]
siemx = "siemx.cli:main"

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["siemx"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
