name: convert-detections
on:
  push:
    branches: [main]
    paths: ["detections/spl/**", "mappings/**", "gold/**", "siemx/**"]
  workflow_dispatch:
    inputs:
      client:
        description: "Client name (uses mappings/clients/<client>/, writes converted/<client>/). Empty = shared mappings only."
        required: false
        default: ""
      path:
        description: "Only convert detections/spl/<path>/** (optional)"
        required: false
        default: ""
  schedule:
    - cron: "0 2 * * 0"   # weekly full recheck after docs/model changes

permissions:
  contents: write
  pull-requests: write

jobs:
  convert:
    runs-on: ubuntu-latest
    env:
      SIEMX_CLIENT: ${{ inputs.client }}
      SIEMX_PATH: ${{ inputs.path }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: "3.12" }
      - run: pip install -e .
      - name: Install the official KQL parser (validation)
        run: npm ci --prefix tools/kql-validate
      - name: Convert (unchanged files are skipped by hash)
        env:
          # model choice = repository variables (Settings -> Secrets and variables ->
          # Actions -> Variables); keys = secrets. Unset -> anthropic default.
          SIEMX_PROVIDER: ${{ vars.SIEMX_PROVIDER }}
          SIEMX_MODEL: ${{ vars.SIEMX_MODEL }}
          SIEMX_BASE_URL: ${{ vars.SIEMX_BASE_URL }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SIEMX_API_KEY: ${{ secrets.SIEMX_API_KEY }}
        run: siemx convert --to kql,xql,elk --workers 4 ${SIEMX_PATH:+--path "$SIEMX_PATH"} | tee run.jsonl
      - name: Summary
        run: |
          echo "### siemx status ${SIEMX_CLIENT:-(shared mappings)}" >> "$GITHUB_STEP_SUMMARY"
          siemx status >> "$GITHUB_STEP_SUMMARY"
      - name: Open PR with converted queries
        uses: peter-evans/create-pull-request@v8
        with:
          branch: bot/siemx-conversions${{ inputs.client && format('-{0}', inputs.client) || '' }}
          title: "siemx: converted detections${{ inputs.client && format(' ({0})', inputs.client) || '' }}"
          commit-message: "siemx: update converted queries"
          body: "Auto-converted. Review items marked needs-review/unsupported (run `siemx review`)."
          add-paths: converted/**
